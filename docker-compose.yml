name: ets-emea

services:
  # Next.js / React frontend with live reload at http://localhost:3000.
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      API_INTERNAL_URL: http://backend
    volumes:
      - ./frontend:/app # Share source code for live edits
      - frontend_node_modules:/app/node_modules # Docker-only dependencies
      - frontend_next:/app/.next # Docker-only build cache
    init: true

  # Symfony REST API at http://localhost:8000.
  backend:
    build: ./backend
    ports:
      - "127.0.0.1:8000:80"
    env_file: ./backend/docker/dev.env
    volumes:
      - ./backend:/var/www/html # Share source code for live edits
      - backend_vendor:/var/www/html/vendor # Docker-only PHP dependencies
      - backend_var:/var/www/html/var # Symfony cache and logs
      - backend_jwt:/var/lib/jwt # Preserve JWT signing keys
    depends_on:
      database:
        condition: service_healthy # Wait until MongoDB is ready

  # MongoDB storage; no host port, reachable as database:27017 in Docker.
  database:
    image: mongo:8.0
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ ping: 1 }).ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

# Keep container dependencies/caches separate from host files, and preserve data.
volumes:
  frontend_node_modules: # Linux Node dependencies
  frontend_next:        # Next.js build cache (.next)
  backend_vendor:       # PHP Composer dependencies
  backend_var:          # Symfony cache and logs
  backend_jwt:          # Generated signing keys, preserved across restarts
  mongodb_data:         # Database documents and indexes
  mongodb_config:       # MongoDB configuration data
