ServerName localhost

<VirtualHost *:80>
    DocumentRoot /var/www/html/public
    <Directory /var/www/html/public>
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
        FallbackResource /index.php
        CGIPassAuth On
    </Directory>
    # Liveness only; database readiness is checked by Compose separately.
    Alias /healthz /var/www/healthz.txt
    <Directory /var/www>
        Require all granted
    </Directory>
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
